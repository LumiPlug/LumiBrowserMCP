<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lumi Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="status-row">
        <span id="connection" role="status">正在连接 Lumi…</span>
        <span class="help-wrap">
          <button id="help" aria-label="权限说明" aria-describedby="help-text">
            ?
          </button>
          <span id="help-text" role="tooltip"
            >首次允许需确认 Chrome
            网站权限；普通网页默认允许。此页规则忽略参数和片段，并同步至
            Lumi。接管后需明确允许才恢复。请先在 Lumi 的 Browser User
            中检查连接；关闭连接后此处无法启用。</span
          >
        </span>
      </div>
      <button id="toggle" disabled>允许此页</button>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
